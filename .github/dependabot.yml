version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      composer-dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
      composer-prod-patch:
        dependency-type: production
        update-types: ["patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Europe/Warsaw
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
