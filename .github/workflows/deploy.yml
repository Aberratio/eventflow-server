name: Deploy API

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where should the API be deployed?"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      migration_mode:
        description: "How should database migrations be handled?"
        required: true
        default: run
        type: choice
        options:
          - run
          - skip
      confirm_production:
        description: "Type DEPLOY_PRODUCTION to confirm production deploy."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_mode || 'run' }}
  CONFIRM_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production || '' }}

jobs:
  guard:
    name: Guard deploy inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy inputs
        env:
          GUARD_OPERATION: deploy
          GUARD_EVENT: ${{ github.event_name }}
          GUARD_TARGET: ${{ env.TARGET_ENV }}
          GUARD_CONFIRM: ${{ env.CONFIRM_PRODUCTION }}
          GUARD_REF: ${{ github.ref }}
          GUARD_PRODUCTION_REF: refs/heads/master
          GUARD_MIGRATION_MODE: ${{ env.MIGRATION_MODE }}
        run: bash scripts/ci/deploy-guard.sh

  deploy:
    name: Deploy API ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: guard
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: zmierzymy_czas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
          BACKEND_ALLOWED_ROOT: ${{ secrets.BACKEND_ALLOWED_ROOT }}
          BACKEND_BACKUP_DIR: ${{ secrets.BACKEND_BACKUP_DIR }}
          API_URL: ${{ secrets.API_URL }}
        run: bash scripts/deploy/require-env.sh SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS BACKEND_REMOTE_DIR BACKEND_ALLOWED_ROOT BACKEND_BACKUP_DIR API_URL

      - name: Compute deploy id
        run: echo "DEPLOY_ID=${TARGET_ENV}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, zlib
          tools: composer:v2

      - name: Install dependencies (with dev, for test gate)
        run: |
          set -Eeuo pipefail
          composer validate --no-check-publish
          composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Configure test env
        run: |
          cat > .env <<'ENV'
          APP_ENV=local
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=zmierzymy_czas_test
          DB_USERNAME=root
          DB_PASSWORD=
          JWT_SECRET=ci-test-secret
          APP_CORS_ORIGIN=*
          ENV
      # APP_ENV=local above is required: bin/seed.php refuses to run against a
      # database whose APP_ENV is production, which is the default when unset.

      - name: Lint
        run: composer lint

      - name: Migrate test database
        run: composer migrate

      - name: Seed test database
        run: composer seed

      - name: Run Unit tests
        run: composer test -- --testsuite Unit --fail-on-skipped

      - name: Run Integration tests
        run: composer test -- --testsuite Integration --fail-on-skipped --exclude-group requires-local-samples

      - name: Build API artifact
        run: |
          set -Eeuo pipefail
          rm -f .env
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          find public src bin database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l
          mkdir -p artifact
          rsync -a ./ artifact/api/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='artifact' \
            --exclude='tests' \
            --exclude='vendor/phpunit'
          # VERSION is set only for a vYYYY.MM.PATCH release tag (RELEASING.md), not for
          # rollback-* tags; /health reports it.
          RELEASE_VERSION=""
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          printf 'DEPLOY_ID=%s\nGIT_SHA=%s\nVERSION=%s\nRUN_URL=%s/%s/actions/runs/%s\n' \
            "$DEPLOY_ID" "$GITHUB_SHA" "$RELEASE_VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > artifact/api/.zmierzymy-czas-release
          cd artifact/api
          zip -r ../api.zip .

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy/configure-ssh.sh

      - name: Upload and deploy API
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
          BACKEND_ALLOWED_ROOT: ${{ secrets.BACKEND_ALLOWED_ROOT }}
          BACKEND_BACKUP_DIR: ${{ secrets.BACKEND_BACKUP_DIR }}
        run: |
          set -Eeuo pipefail
          if [ "$TARGET_ENV" = "production" ] && [ "$CONFIRM_PRODUCTION" != "DEPLOY_PRODUCTION" ]; then
            echo "Production deploy requires confirm_production=DEPLOY_PRODUCTION."
            exit 50
          fi
          REMOTE_ZIP="$BACKEND_REMOTE_DIR/.deploy/api-${DEPLOY_ID}.zip"
          printf -v REMOTE_ENV 'BACKEND_REMOTE_DIR=%q BACKEND_ALLOWED_ROOT=%q BACKEND_BACKUP_DIR=%q REMOTE_ZIP=%q TARGET_ENV=%q MIGRATION_MODE=%q DEPLOY_ID=%q' "$BACKEND_REMOTE_DIR" "$BACKEND_ALLOWED_ROOT" "$BACKEND_BACKUP_DIR" "$REMOTE_ZIP" "$TARGET_ENV" "$MIGRATION_MODE" "$DEPLOY_ID"
          ssh_remote() { ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s -- $*" < scripts/deploy/api-remote.sh; }
          ssh_remote preflight
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o BatchMode=yes artifact/api.zip "$SSH_USER@$SSH_HOST:$REMOTE_ZIP"
          ssh_remote install

      - name: Health check
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -Eeuo pipefail
          EXPECTED_COMMIT="${GITHUB_SHA::7}"
          ACTUAL_COMMIT=""
          # Retries give PHP's opcache time to pick up the new code before judging it.
          for attempt in $(seq 1 12); do
            if HEALTH="$(curl --fail --silent --show-error --location "${API_URL%/}/health")"; then
              printf '%s\n' "$HEALTH"
              ACTUAL_COMMIT="$(printf '%s' "$HEALTH" | jq -r '.data.commit // empty' 2>/dev/null || true)"
              if [ "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" ]; then
                exit 0
              fi
            fi
            echo "Attempt ${attempt}/12: /health reports commit '${ACTUAL_COMMIT}', expected '${EXPECTED_COMMIT}'."
            sleep 5
          done
          echo "::error::/health never reported commit ${EXPECTED_COMMIT}. The new code is already installed; check the host (opcache, failed swap) or roll back (docs/RUNBOOK.md)."
          exit 1
